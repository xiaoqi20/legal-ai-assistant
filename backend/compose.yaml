name: law-backend
services:
  minio:
    image: ${LAW_MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LAW_S3_ACCESS_KEY_ID:?Set in backend/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${LAW_S3_CORS_ORIGINS:-http://localhost:5173}
      MINIO_ROOT_PASSWORD: ${LAW_S3_SECRET_ACCESS_KEY:?Set in backend/.env}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  minio-data:
