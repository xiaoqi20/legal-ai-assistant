[project]
name = "law-ai-backend"
version = "0.1.0"
description = "律法 AI 一期：PostgreSQL 显式 RAG 与 DeepSeek 流式问答"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.10,<3",
  "pydantic==2.14.3",
  "sqlalchemy[asyncio]==2.1.8",
  "alembic==1.20.1",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "alibabacloud-ocr-api20210707>=3.1.3",
  "pypdfium2>=5.15.2",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
